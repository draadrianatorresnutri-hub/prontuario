<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Prontuário – Dra. Adriana B. Torres</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#F0EDE6;--card:#FAF5EB;--cell:#E8E4DA;--bd:#D4CFC4;--tx:#2b2924;--mut:#7a7570;--gold:#C9A84C;--dk:#9a7830;--teal:#5BAEC0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a17;--card:#26231f;--cell:#312d28;--bd:#47423a;--tx:#ece7dc;--mut:#a39d91;--dk:#d9b862;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1a17;--card:#26231f;--cell:#312d28;--bd:#47423a;--tx:#ece7dc;--mut:#a39d91;--dk:#d9b862;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,Arial,sans-serif}
header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:2px solid var(--gold);flex-wrap:wrap}
header img{height:50px;max-width:100%}
h1{font:italic 400 28px 'Playfair Display',Georgia,serif;color:var(--gold);margin:0}
header small{display:block;color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.app{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:16px 20px;max-width:1200px;margin:auto}
aside{align-self:start;position:sticky;top:8px}
#lst{max-height:55vh;overflow:auto;margin:8px 0}
.it{padding:8px 10px;border:1px solid var(--bd);border-left:4px solid var(--bd);background:var(--card);cursor:pointer;border-radius:4px;margin-bottom:6px}
.it.on{border-left-color:var(--gold)}.it small{display:block;color:var(--mut);font-size:11px}
section{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:14px 16px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
section>h2{grid-column:1/-1;margin:0;font:italic 400 22px 'Playfair Display',Georgia,serif;color:var(--dk);border-bottom:1px solid var(--gold);padding-bottom:4px}
section>.w,section>.sc,section>.full,section>h3,section>.chips{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--dk)}
input,textarea,select{font:400 14px Inter,Arial,sans-serif;color:var(--tx);background:var(--cell);border:1px solid var(--bd);border-radius:4px;padding:6px 8px;width:100%;text-transform:none;letter-spacing:0}
textarea{min-height:56px;resize:vertical;overflow:hidden}
input:focus,textarea:focus,select:focus{outline:2px solid var(--teal)}
.ck{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;color:var(--tx)}.ck input{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:4px 16px}
h3{margin:4px 0 0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--gold);color:#fff;padding:4px;font-size:12px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
th input{background:#fff3;color:#fff;border-color:#fff6;padding:3px}
td{border:1px solid var(--bd);padding:0}td:first-child{padding:4px 8px;font-weight:500;white-space:nowrap}
td input{border:0;border-radius:0;background:transparent}
#evs{display:grid;gap:10px}.ev{border:1px dashed var(--gold);border-radius:6px;padding:10px;display:grid;gap:8px}
button{font:600 13px Inter,Arial,sans-serif;border-radius:4px;padding:9px 16px;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--dk)}
button.p{background:var(--gold);color:#fff}button.t{border-color:var(--teal);color:var(--teal)}button:disabled{opacity:.5}
.bar{position:sticky;bottom:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--bg);border-top:2px solid var(--gold);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
#st{color:var(--mut);font-size:12px;margin-left:auto}.note{font-size:12px;color:var(--mut)}
@media(max-width:800px){.app{grid-template-columns:1fr}aside{position:static}}
@media print{:root,:root[data-theme]{--bg:#fff;--card:#fff;--cell:#fff;--bd:#ccc;--tx:#222;--mut:#666;--dk:#9a7830}aside,.bar,button{display:none!important}.app{display:block;padding:0}section{break-inside:avoid;border:0;padding:6px 0}input:not([type=checkbox]),textarea,select{border:0;border-bottom:1px solid #ccc;border-radius:0;appearance:none;resize:none}input[type=checkbox]{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1.5px solid #555;border-radius:2px;position:relative;print-color-adjust:exact;-webkit-print-color-adjust:exact}input[type=checkbox]:checked{background:#9a7830;border-color:#9a7830}input[type=checkbox]:checked::after{content:"✓";position:absolute;left:1px;top:-3px;color:#fff;font-size:13px;line-height:16px}tr{break-inside:avoid}.vz{color:transparent!important}}
</style></head><body>

const AN='Peso atual (kg),Peso habitual (kg),Peso sugerido (kg),Estatura (cm),IMC,C. cintura,C. umbigo,C. quadril,C. peito superior,C. peito inferior,MSD bíceps,MSD tríceps,MSE bíceps,MSE tríceps,MID quadríceps,MIE quadríceps,MID panturrilha,MIE panturrilha'.split(',');
const LB='Hemoglobina,Colesterol total,C-HDL,C-LDL,C-VLDL,HDL/VLDL,Triglicérides (TG),Plaquetas,Cálcio,Creatinina,Ureia,Hemoglobina glicada,Glicemia jejum,Glicemia pós-prandial,Insulina,Sódio,Ác. úrico,T3,T4,TSH,TGO,TGP,Vit. D,B12'.split(',');
const AC=['Leites e derivados|Leite desnatado,Leite integral,Leite semi,Iogurte,Queijo,Requeijão,Manteiga,Margarina','Frutas|Abacaxi,Abacate,Banana,Kiwi,Laranja,Melancia,Mamão,Maçã,Melão,Uva,Frutas vermelhas','Verduras|Alface,Almeirão,Acelga,Agrião,Brócolis,Couve-flor,Couve,Cebola,Chicória,Pepino,Maxixe,Repolho,Rúcula,Tomate','Legumes|Alho,Abóbora,Abobrinha,Berinjela,Beterraba,Cenoura,Chuchu,Jiló,Quiabo,Mandioca,Vagem','Proteínas|Aves,Bovina,Frutos do mar,Peixes,Suína,Vegetal','Grãos|Arroz,Aveia,Amaranto,Centeio,Ervilha,Feijão,Grão-de-bico,Lentilha,Milho,Quinoa,Trigo'];
const EV=[['ing','Alteração da ingestão alimentar'],['tol','Tolerância digestiva'],['ex','Exame físico'],['cap','Capacidade funcional'],['cond','Conduta / observações']];
const FORM=[
SEC('Informações pessoais',I('nome','Paciente','text','w')+S('sexo','Sexo',['Feminino','Masculino'])+I('genero','Gênero')+I('nasc','Data de nascimento','date')+I('idade','Idade')+S('civil','Estado civil',['Solteiro(a)','Casado(a)','União estável','Divorciado(a)','Viúvo(a)'])+I('cel','Celular','tel')+I('email','E-mail','email')+I('obj','Objetivo')),
SEC('Recordatório de 24 horas',T('rec','Registre as refeições, horários, quantidades e preparos')),
SEC('Anamnese clínica','<h3>Antecedentes familiares e/ou pessoais</h3>'+CH('ant',['Cardiopatias','DM','Tabagismo','Doença renal','HA','Etilismo','Doença do fígado','Obesidade','Atividade física'])+I('ant_o','Outros','text','w')+T('pesoaum','Aumento de peso (causa | tempo)')+I('trat','Tratamento de saúde (especialidade)')+I('atfis','Atividade física')+T('med','Medicamentos')),
SEC('Anamnese gastrointestinal',T('gi1','Trato urinário (dor, frequência, excreção, coloração)')+T('gi2','Intestino (evacuação, características e frequência das fezes, flatulência)')+T('gi3','Esôfago (disfagia, dor, refluxo, pirose)')+T('gi4','Estômago (náusea, vômito, dor, plenitude, dispepsia)')+T('gi5','Boca (lábios, mucosa, dentes, deglutição)')),
SEC('Anamnese alimentar',I('al1','Apetite')+I('al2','Alergia alimentar')+I('al3','Ingesta hídrica')+I('al4','Ingesta de sal')+I('al5','Mastigação')+I('al6','Uso de adoçante')+I('al7','Forma de preparação do alimento')),
SEC('Aceitação alimentar','<p class="note full">Marque os alimentos aceitos pelo paciente.</p>'+AC.map((g,i)=>{const[t,l]=g.split('|');return `<h3>${t}</h3>`+CH('ac'+i+'_',l.split(','))}).join('')+I('ac_o','Outros','text','w')),
SEC('Avaliação física','<h3>Medidas antropométricas</h3>'+TAB('a',AN,5,'Medidas')+'<h3>Cabelos</h3>'+CH('cab',['Fino','Quebradiços','Queda'])+'<h3>Unhas</h3>'+CH('un',['Finas','Listras transversais rugosas','Manchas brancas','Foscas','Normais','Côncavas (formato de colher)'])+T('exfis','Exame físico')+T('capfun','Capacidade funcional')),
SEC('Bioquímica · Exames laboratoriais',TAB('l',LB,4,'Exames')),
SEC('Diagnóstico nutricional',T('diag','Diagnóstico de nutrição (dados diretos e indiretos, métodos e protocolo utilizados)')),
SEC('Prescrição dietética',I('vet','VET (kcal/dia)')+I('prot','Proteínas')+I('carb','Carboidratos')+I('gord','Gorduras')+I('micro','Micronutrientes relevantes ao caso')+I('cons','Consistência')+I('frac','Fracionamento')+T('presc','Prescrição / plano alimentar')),
SEC('Evolução do tratamento','<div id="evs" class="full"></div><button type="button" class="t" id="ae">+ Adicionar evolução</button>'),
SEC('Educação alimentar e nutricional',T('ean','Ações realizadas (tema, material, orientações ao paciente e familiares)')),
SEC('Alta',I('altadt','Data da alta','date')+T('alta','Descritivo da alta (motivo, resultados alcançados, condição ao final do acompanhamento)')),
SEC('Orientações alimentares pós-alta',T('pos','Orientações alimentares pós-alta')+'<button type="button" class="t" id="ia">✨ Sugerir com IA</button><span class="note full">A sugestão é gerada sem nome ou contatos do paciente e deve ser revisada pela nutricionista.</span>'),
'<div class="bar"><button class="p" id="sv">Salvar alterações</button><button id="pr">Salvar PDF / Imprimir</button><span id="st"></span></div>'].join('');
let db=null,pacs=[],cur=null,dirty=false;
const msg=t=>{const s=$('#st');if(s)s.textContent=t};
const grow=t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'};
const num=s=>parseFloat(String(s).replace(',','.'));
const g=k=>$(`[data-k="${k}"]`);
function calc(){for(let c=0;c<5;c++){const p=num(g('a0_'+c).value);let h=num(g('a3_'+c).value);if(h>3)h/=100;g('a4_'+c).value=p>0&&h>0?(p/h/h).toFixed(1):''}
const n=g('nasc').value;let r='';if(n){const b=new Date(n),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;if(a>=0)r=a+' anos'}g('idade').value=r}
function addEv(e){e=e||{};const el=document.createElement('div');el.className='ev';el.innerHTML=`<label>Data<input type="date" class="evd" value="${esc(e.data||new Date().toISOString().slice(0,10))}"></label>`+EV.map(([k,l])=>`<label>${l}<textarea data-e="${k}">${esc(e[k])}</textarea></label>`).join('');$('#evs').append(el);el.querySelectorAll('textarea').forEach(grow)}
function collect(){const d={};$$('#m [data-k]').forEach(e=>{const v=e.type==='checkbox'?e.checked:e.value;if(v)d[e.dataset.k]=v});d.ev=$$('.ev').map(el=>{const o={data:el.querySelector('.evd').value};el.querySelectorAll('[data-e]').forEach(t=>o[t.dataset.e]=t.value);return o});return d}
function ret(){const r=$('#ret');if(r)r.textContent=cur.retencaoAte?'Prontuário guardado e acessível até '+br(cur.retencaoAte)+' (5 anos a partir da última atualização).':'Ao salvar, o prontuário fica guardado por 5 anos.'}
function openP(p){cur=p;dirty=false;$('#m').innerHTML='<p class="note" id="ret"></p>'+FORM;const d=p.d||{};
$$('#m [data-k]').forEach(e=>{const v=d[e.dataset.k];if(e.type==='checkbox')e.checked=!!v;else e.value=v||''});
g('idade').readOnly=true;(d.ev||[]).forEach(addEv);calc();$$('#m textarea').forEach(grow);ret();list();scrollTo(0,0)}
function list(){const q=$('#q').value.toLowerCase();$('#lst').innerHTML=pacs.filter(p=>(p.nome||'').toLowerCase().includes(q)).sort((a,b)=>(b.atualizadoEm||'').localeCompare(a.atualizadoEm||'')).map(p=>`<div class="it${cur&&cur.id===p.id?' on':''}" data-id="${esc(p.id)}">${esc(p.nome)}<small>Atualizado em ${br(p.atualizadoEm)}</small></div>`).join('')||'<p class="note">Nenhum paciente cadastrado.</p>'}
async function persist(p){const o={nome:p.nome,d:p.d,criadoEm:p.criadoEm,atualizadoEm:p.atualizadoEm,retencaoAte:p.retencaoAte};
if(db)await db.doc('pacientes/'+p.id).set(o);else localStorage.setItem('pac5',JSON.stringify(pacs.filter(x=>x.id!==p.id).concat(p)))}
async function save(){const d=collect();if(!d.nome){msg('Informe o nome do paciente.');return}
const n=new Date(),r=new Date(n);r.setFullYear(r.getFullYear()+5);
Object.assign(cur,{nome:d.nome,d,atualizadoEm:n.toISOString(),retencaoAte:r.toISOString(),criadoEm:cur.criadoEm||n.toISOString()});
try{await persist(cur);if(!pacs.some(x=>x.id===cur.id))pacs.push(cur);dirty=false;msg('Salvo às '+n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));ret();list()}catch(e){msg('Erro ao salvar: '+(e.message||e.code||'tente novamente'))}}
async function ia(){const ta=g('pos'),d=collect();let s=null;try{s=await claude.use('sample')}catch(e){}
const c=[['Sexo',d.sexo],['Idade',d.idade],['Objetivo',d.obj],['Alergias',d.al2],['Atividade física',d.atfis],['Diagnóstico nutricional',d.diag],['VET',d.vet],['Prescrição',d.presc],['Descritivo da alta',d.alta]].filter(x=>x[1]).map(x=>x.join(': ')).join('\n');
const pr='Você apoia uma nutricionista clínica brasileira. Com base no contexto abaixo (sem dados de identificação), escreva em português do Brasil de 6 a 8 orientações alimentares curtas e práticas para o paciente seguir APÓS a alta, para manter os resultados: organização das refeições, qualidade e porções, hidratação, autonomia, situações sociais e retorno ao acompanhamento. Não prescreva calorias exatas, suplementos ou medicamentos e não faça diagnóstico. Formato: lista com “• ”, sem títulos nem introdução.\n\nContexto:\n'+(c||'Não informado');
const base=ta.value,btn=$('#ia'),out=t=>{ta.value=base+(base?'\n\n':'')+t;grow(ta)};btn.disabled=true;msg('Gerando sugestão…');
try{let t;
if(s){const r=await s(pr,{modelTier:'quick',cache:false,onText:({text})=>out(text)});t=r.text}
else{const r=await fetch('/.netlify/functions/sugerir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:pr})});if(!r.ok)throw new Error('http '+r.status);t=(await r.json()).text}
out(t);dirty=true;msg('Sugestão inserida — revise antes de entregar ao paciente.')}
catch(e){ta.value=base;grow(ta);msg(e&&e.code==='not_granted'?'Permissão negada para a IA.':'Não foi possível gerar a sugestão. Confira a função e a chave no Netlify.')}finally{btn.disabled=false}}
$('#m').oninput=e=>{dirty=true;msg('Alterações não salvas');if(e.target.tagName==='TEXTAREA')grow(e.target);calc()};
$('#m').onclick=e=>{const i=e.target.id;if(i==='sv')save();else if(i==='ae'){addEv();dirty=true}else if(i==='ia')ia();else if(i==='pr'){document.title='Prontuario - '+(g('nome').value||'paciente');$$('textarea').forEach(grow);window.print()}};
window.onbeforeprint=()=>{$$('textarea').forEach(grow);$$('input[type=date]').forEach(i=>i.classList.toggle('vz',!i.value))};window.onafterprint=()=>$$('.vz').forEach(i=>i.classList.remove('vz'));
$('#nv').onclick=()=>{if(dirty)return msg('Salve as alterações antes de abrir outro paciente.');openP({id:'p'+Date.now().toString(36),d:{}})};
$('#q').oninput=list;
$('#lst').onclick=e=>{const it=e.target.closest('.it');if(!it)return;if(dirty)return msg('Salve as alterações antes de trocar de paciente.');openP(pacs.find(p=>p.id===it.dataset.id))};
$('#bk').onclick=async()=>{const fn='backup-prontuarios-'+new Date().toISOString().slice(0,10)+'.json',dat=JSON.stringify(pacs,null,1);let dl=null;try{dl=await claude.use('downloads')}catch(e){}try{if(dl)await dl.save({filename:fn,data:dat});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([dat],{type:'application/json'}));a.download=fn;a.click()}}catch(e){}};
(async()=>{list();let s='';try{db=await claude.use('db')}catch(e){}
if(db){try{const q=await db.collection('pacientes').get();pacs=q.docs.map(x=>Object.assign({id:x.id},x.data()));s='Dados salvos no banco deste artefato. Faça backup periódico.'}catch(e){db=null}}
if(!db){try{pacs=JSON.parse(localStorage.getItem('pac5')||'[]')}catch(e){}s='⚠ Banco indisponível: dados salvos só neste navegador. Use o backup.'}
$('#sd').textContent=s;list()})();
</script></body></html>
